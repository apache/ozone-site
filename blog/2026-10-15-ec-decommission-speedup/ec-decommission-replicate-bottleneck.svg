<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">EC decommission 1:1 replication source bottleneck</title>
  <desc id="desc">Many Datanodes exist in the cluster, but each replicate command reads from the decommissioning Datanode, so that node remains the throughput choke point.</desc>
  <defs>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="920" height="420" fill="#f8fafc"/>
  <rect x="24" y="20" width="872" height="72" rx="8" fill="#1e3a5f"/>
  <text x="48" y="50" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Trap 1: The decommissioning node is always the source</text>
  <text x="48" y="74" fill="#dbeafe" font-family="system-ui, sans-serif" font-size="13">Adding Datanodes adds targets, not alternate read sources for each EC stripe on the leaving node.</text>

  <rect x="48" y="112" width="824" height="268" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="72" y="140" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Ozone cluster (many Datanodes)</text>

  <g transform="translate(120, 200)">
    <rect width="120" height="100" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="60" y="36" text-anchor="middle" fill="#991b1b" font-family="system-ui, sans-serif" font-size="13" font-weight="700">DN leaving</text>
    <text x="60" y="56" text-anchor="middle" fill="#b91c1c" font-family="system-ui, sans-serif" font-size="11">DECOMMISSIONING</text>
    <text x="60" y="78" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="10">EC stripe fragment</text>
  </g>

  <g transform="translate(320, 168)">
    <rect width="96" height="72" rx="6" fill="#ecfdf5" stroke="#059669"/>
    <text x="48" y="32" text-anchor="middle" fill="#065f46" font-family="system-ui, sans-serif" font-size="12" font-weight="600">DN B</text>
    <text x="48" y="50" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="10">EC fragment</text>
  </g>
  <g transform="translate(460, 168)">
    <rect width="96" height="72" rx="6" fill="#ecfdf5" stroke="#059669"/>
    <text x="48" y="32" text-anchor="middle" fill="#065f46" font-family="system-ui, sans-serif" font-size="12" font-weight="600">DN C</text>
    <text x="48" y="50" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="10">EC fragment</text>
  </g>
  <g transform="translate(600, 168)">
    <rect width="96" height="72" rx="6" fill="#ecfdf5" stroke="#059669"/>
    <text x="48" y="32" text-anchor="middle" fill="#065f46" font-family="system-ui, sans-serif" font-size="12" font-weight="600">DN D</text>
    <text x="48" y="50" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="10">EC fragment</text>
  </g>
  <g transform="translate(740, 200)">
    <rect width="100" height="88" rx="6" fill="#eff6ff" stroke="#2563eb"/>
    <text x="50" y="36" text-anchor="middle" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">New target</text>
    <text x="50" y="56" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="10">replacement</text>
    <text x="50" y="72" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="10">replica</text>
  </g>

  <path d="M240 250 L720 244" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow-red)"/>
  <text x="480" y="232" text-anchor="middle" fill="#dc2626" font-family="system-ui, sans-serif" font-size="12" font-weight="600">ReplicateContainer: full read from leaving node</text>

  <path d="M368 240 L220 260" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-gray)"/>
  <path d="M508 240 L220 265" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <path d="M648 240 L220 270" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="480" y="310" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Other EC fragments are not used as replication sources for this recovery path</text>

  <text x="480" y="352" text-anchor="middle" fill="#334155" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Fleet size does not linearize decommission while recovery is defined this way.</text>
</svg>
