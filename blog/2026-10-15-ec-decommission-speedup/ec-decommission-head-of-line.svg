<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" role="img" aria-labelledby="title desc">
  <title id="title">Head-of-line blocking on decommissioning Datanode</title>
  <desc id="desc">Thousands of replicate tasks queue on one Datanode outbound pipeline, so new work waits behind older work.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="920" height="400" fill="#f8fafc"/>
  <rect x="24" y="20" width="872" height="72" rx="8" fill="#1e3a5f"/>
  <text x="48" y="50" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Trap 2: Head-of-line blocking on that choke point</text>
  <text x="48" y="74" fill="#dbeafe" font-family="system-ui, sans-serif" font-size="13">Every replicate job shares one outbound queue, disk concurrency, and network on the node you need to drain.</text>

  <g transform="translate(48, 120)">
    <text x="0" y="0" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" font-weight="600">SCM schedules many ReplicateContainer commands</text>
    <rect x="0" y="16" width="824" height="44" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="16" y="44" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Container A, Container B, Container C, ... Container N (all source = same DN)</text>
  </g>

  <g transform="translate(280, 200)">
    <rect width="360" height="140" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="180" y="32" text-anchor="middle" fill="#991b1b" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Decommissioning Datanode</text>
    <rect x="24" y="48" width="312" height="28" rx="4" fill="#fee2e2" stroke="#f87171"/>
    <text x="36" y="67" fill="#7f1d1d" font-family="system-ui, sans-serif" font-size="10">Replication queue (head to tail)</text>
    <rect x="36" y="88" width="48" height="36" rx="3" fill="#dc2626"/>
    <text x="60" y="110" text-anchor="middle" fill="#fff" font-family="system-ui, sans-serif" font-size="9">HOL</text>
    <rect x="92" y="88" width="48" height="36" rx="3" fill="#f87171"/>
    <rect x="148" y="88" width="48" height="36" rx="3" fill="#fca5a5"/>
    <rect x="204" y="88" width="48" height="36" rx="3" fill="#fecaca"/>
    <text x="280" y="110" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">more waiting</text>
    <text x="180" y="132" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="10">Limited outbound reads / streams</text>
  </g>

  <line x1="460" y1="340" x2="460" y2="368" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="460" y="388" text-anchor="middle" fill="#334155" font-family="system-ui, sans-serif" font-size="12">New decommission copies wait behind work already in line</text>
</svg>
