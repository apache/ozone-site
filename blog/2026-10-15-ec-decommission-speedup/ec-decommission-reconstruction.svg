<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" role="img" aria-labelledby="title desc">
  <title id="title">EC decommission reconstruction and SCM decision</title>
  <desc id="desc">When the decommissioning source is highly loaded, SCM may schedule multi-source EC reconstruction from IN_SERVICE datanodes instead of 1:1 replication from the leaving node.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
  </defs>
  <rect width="920" height="480" fill="#f8fafc"/>
  <rect x="24" y="16" width="872" height="76" rx="8" fill="#1e3a5f"/>
  <text x="48" y="46" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Solution: reconstruct across the cluster, fall back when needed</text>
  <text x="48" y="72" fill="#dbeafe" font-family="system-ui, sans-serif" font-size="13">Shift hot decommission work off the leaving node; break HOL by using parallel multi-source reads (HDDS-15014).</text>

  <!-- SCM -->
  <g transform="translate(380, 108)">
    <rect width="160" height="64" rx="8" fill="#2563eb"/>
    <text x="80" y="40" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">SCM</text>
  </g>

  <!-- Decision box -->
  <g transform="translate(48, 108)">
    <rect width="280" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="16" y="28" fill="#334155" font-family="system-ui, sans-serif" font-size="12" font-weight="700">When enabled + source hot:</text>
    <text x="16" y="50" fill="#475569" font-family="system-ui, sans-serif" font-size="11">" ReconstructECContainers</text>
    <text x="16" y="68" fill="#475569" font-family="system-ui, sans-serif" font-size="11">" Global limit + fallbacks</text>
    <text x="16" y="86" fill="#475569" font-family="system-ui, sans-serif" font-size="11">" Else ReplicateContainer</text>
    <text x="16" y="108" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">hdds.scm.replication.decommission.ec.*</text>
  </g>

  <line x1="328" y1="168" x2="378" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Decom node faded -->
  <g transform="translate(80, 280)">
    <rect width="100" height="80" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 3"/>
    <text x="50" y="36" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="600">DN leaving</text>
    <text x="50" y="54" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">not read source</text>
  </g>

  <!-- IN_SERVICE sources -->
  <g transform="translate(260, 260)">
    <rect width="88" height="72" rx="6" fill="#ecfdf5" stroke="#059669"/>
    <text x="44" y="32" text-anchor="middle" fill="#065f46" font-family="system-ui, sans-serif" font-size="11" font-weight="600">DN B</text>
    <text x="44" y="50" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="10">IN_SERVICE</text>
  </g>
  <g transform="translate(380, 260)">
    <rect width="88" height="72" rx="6" fill="#ecfdf5" stroke="#059669"/>
    <text x="44" y="32" text-anchor="middle" fill="#065f46" font-family="system-ui, sans-serif" font-size="11" font-weight="600">DN C</text>
    <text x="44" y="50" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="10">IN_SERVICE</text>
  </g>
  <g transform="translate(500, 260)">
    <rect width="88" height="72" rx="6" fill="#ecfdf5" stroke="#059669"/>
    <text x="44" y="32" text-anchor="middle" fill="#065f46" font-family="system-ui, sans-serif" font-size="11" font-weight="600">DN D</text>
    <text x="44" y="50" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="10">IN_SERVICE</text>
  </g>

  <!-- Targets -->
  <g transform="translate(680, 268)">
    <rect width="96" height="64" rx="6" fill="#eff6ff" stroke="#2563eb"/>
    <text x="48" y="38" text-anchor="middle" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">New targets</text>
  </g>

  <path d="M460 140 L304 260" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M460 140 L424 260" fill="none" stroke="#2563eb" stroke-width="2"/>
  <path d="M460 140 L544 260" fill="none" stroke="#2563eb" stroke-width="2"/>

  <path d="M348 296 L672 300" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <path d="M424 296 L672 300" fill="none" stroke="#059669" stroke-width="2.5"/>
  <path d="M544 296 L672 300" fill="none" stroke="#059669" stroke-width="2.5"/>
  <text x="520" y="248" text-anchor="middle" fill="#059669" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Multi-source EC reconstruction reads</text>

  <rect x="48" y="400" width="824" height="56" rx="6" fill="#e0f2fe" stroke="#7dd3fc"/>
  <text x="72" y="424" fill="#0c4a6e" font-family="system-ui, sans-serif" font-size="11">Metrics: EcReconstructionDecommissionTriggeredTotal, InflightEcReconstruction, EcDecommissionReconstructionFallback*</text>
  <text x="72" y="442" fill="#0369a1" font-family="system-ui, sans-serif" font-size="11">See ReplicationManagerMetrics on SCM · Epic HDDS-15014</text>
</svg>
