# Static analysis of website files. These jobs do not build or run the website.
# Most install only pnpm's dev dependencies (--dev); the lint job needs a full
# install because eslint's import resolver relies on an optional native binding.

name: static

on:
  workflow_call:

concurrency:
  group: static-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  script_dir: .github/scripts
  resource_dir: .github/resource
  node_version: 20

jobs:
  license:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout project
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Check Apache license headers
      uses: apache/skywalking-eyes@a196742f472feaffafea537ce5a2a4c3c53a8de4 # v0.9.0
  file-names:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout project
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Run file name check
      working-directory: ${{ env.script_dir }}
      run: |
        ./file_names.sh
  spelling:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout project
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Enable corepack
      run: |
        corepack enable
    - name: Use Node.js ${{ env.node_version }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ env.node_version }}
        cache: pnpm
    - name: Install pnpm dependencies
      # --dev skips the site's build dependencies; cspell only needs devDependencies.
      run: pnpm install --dev --frozen-lockfile
    - name: Run spelling check
      working-directory: ${{ env.script_dir }}
      run: |
        ./spelling.sh
    - name: Output spelling check tips
      if: ${{ failure() }}
      run: |
        cat $resource_dir/spelling_tips.md >> $GITHUB_STEP_SUMMARY
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout project
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Enable corepack
      run: |
        corepack enable
    - name: Use Node.js ${{ env.node_version }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ env.node_version }}
        cache: pnpm
    - name: Install pnpm dependencies
      # Full install (not --dev): eslint-plugin-import-x loads unrs-resolver's
      # native binding, which ships as an optionalDependency that --dev prunes.
      run: pnpm install --frozen-lockfile
    - name: Run lint
      run: pnpm run lint
  check-sidebar:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout project
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Enable corepack
      run: |
        corepack enable
    - name: Use Node.js ${{ env.node_version }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ env.node_version }}
        cache: pnpm
    - name: Install pnpm dependencies
      # --dev skips the site's build dependencies; the sidebar check is a shell script.
      run: pnpm install --dev --frozen-lockfile
    - name: Run docs sidebar check
      working-directory: ${{ env.script_dir }}
      run: |
        ./sidebar.sh
    - name: Output sidebar check tips
      if: ${{ failure() }}
      run: |
        cat $resource_dir/sidebar_tips.md >> $GITHUB_STEP_SUMMARY
